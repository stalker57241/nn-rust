[package]
name = "nn320"
version = "0.1.0"
edition = "2024"
readme = "README.md"
license = "MIT"
description = "Rust library for neural network creation"
repository = "https://github.com/stalker57241/nn-rust"
keywords = ["neural-network", "feed-forward"]
categories = ["artificial-intelligence"]
exclude = ["/mnist"]
publish = false # For now

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
rand = "0.10.3"
